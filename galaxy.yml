license_file: LICENSE

tags:
  - fluentd
  - fluentbit
  - logging
  - observability
  - monitoring
  - logcollector

dependencies:
  "ansible.utils": "*"

repository: https://github.com/stevefulme1/ansible-fluentd
documentation: https://github.com/stevefulme1/ansible-fluentd
homepage: https://github.com/stevefulme1/ansible-fluentd
issues: https://github.com/stevefulme1/ansible-fluentd/issues

build_ignore:
  - .github
  - tests
  - .gitignore
  - .ansible-lint
  - .yamllint
  - docs
  - "*.tar.gz"
  - changelogs/.plugin-cache.yaml
