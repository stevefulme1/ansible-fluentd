---
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff ansible-core>=2.16 ansible-lint
      - run: ruff check --ignore E402,UP001,UP010,I001 .
      - run: ruff format --check .
      - run: ansible-lint --profile shared

  sanity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ansible-version: "2.16"
            python: "3.12"
          - ansible-version: "2.17"
            python: "3.12"
          - ansible-version: "2.18"
            python: "3.12"
          - ansible-version: "2.18"
            python: "3.13"
          - ansible-version: "2.19"
            python: "3.13"
          - ansible-version: "2.20"
            python: "3.13"
          - ansible-version: "2.21"
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/stevefulme1/fluentd
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ansible-core~=${{ matrix.ansible-version }}.0
      - run: ansible-test sanity --python ${{ matrix.python }} -v --color yes
        working-directory: ansible_collections/stevefulme1/fluentd

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/stevefulme1/fluentd
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ansible-core>=2.16 pytest pytest-cov pytest-xdist
      - name: Run unit tests
        working-directory: ansible_collections/stevefulme1/fluentd
        run: python -m pytest tests/unit/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  auto-merge:
    if: github.event_name == 'pull_request' && github.actor == 'stevefulme1'
    needs: [lint, sanity, unit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: hmarr/auto-approve-action@v4
      - run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
