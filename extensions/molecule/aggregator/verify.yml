---
- name: Verify
  hosts: all
  tasks:
    - name: Check fluentd service is running
      ansible.builtin.service_facts:

    - name: Assert fluentd service is active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['fluentd.service'].state == 'running'

    - name: Validate aggregator config
      stevefulme1.fluentd.fluentd_config_validate:
        config_path: /etc/fluent/fluentd.conf
      register: validate_result

    - name: Assert config is valid
      ansible.builtin.assert:
        that:
          - validate_result.valid

    - name: Check monitor agent is accessible
      ansible.builtin.uri:
        url: http://localhost:24220/api/plugins.json
        return_content: true
      register: monitor_result

    - name: Assert monitor agent responds
      ansible.builtin.assert:
        that:
          - monitor_result.status == 200
