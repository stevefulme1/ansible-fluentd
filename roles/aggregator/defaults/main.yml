---
aggregator_config_path: /etc/fluent/fluentd.conf

aggregator_listen_port: 24224
aggregator_bind: 0.0.0.0

aggregator_outputs:
  - tag: "**"
    type: stdout

aggregator_buffer_type: file
aggregator_buffer_path: /var/log/fluentd/buffer
aggregator_flush_interval: 10s

aggregator_monitor_enabled: true
aggregator_monitor_port: 24220

aggregator_required_plugins: []
# - name: fluent-plugin-elasticsearch

aggregator_service_name: fluentd
