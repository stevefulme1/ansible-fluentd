---
- name: Install required aggregator plugins
  stevefulme1.fluentd.fluentd_plugin:
    name: "{{ item.name }}"
    version: "{{ item.version | default(omit) }}"
    state: present
  loop: "{{ aggregator_required_plugins }}"
  when: aggregator_required_plugins | length > 0

- name: Deploy aggregator configuration
  ansible.builtin.template:
    src: aggregator.conf.j2
    dest: "{{ aggregator_config_path }}"
    owner: root
    group: root
    mode: "0640"
  notify: Restart fluentd aggregator

- name: Validate aggregator configuration
  stevefulme1.fluentd.fluentd_config_validate:
    config_path: "{{ aggregator_config_path }}"
