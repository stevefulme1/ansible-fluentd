---
- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Configure Fluentd repository (RedHat)
  ansible.builtin.template:
    src: fluent-package.repo.j2
    dest: "{{ _fluentd_repo_file }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - fluentd_manage_repo
    - ansible_os_family == "RedHat"

- name: Configure Fluentd repository (Debian)
  when:
    - fluentd_manage_repo
    - ansible_os_family == "Debian"
  block:
    - name: Add Treasure Data GPG key
      ansible.builtin.apt_key:
        url: "{{ _fluentd_gpg_key }}"
        state: present

    - name: Add Treasure Data repository
      ansible.builtin.apt_repository:
        repo: "deb {{ _fluentd_repo_url }} {{ ansible_distribution_release }} contrib"
        state: present
        filename: fluent-package

- name: Install Fluentd package
  stevefulme1.fluentd.fluentd_install:
    package_name: "{{ fluentd_package_name }}"
    version: "{{ fluentd_version | default(omit, true) }}"
    state: present
    manage_repo: false

- name: Install Fluentd plugins
  stevefulme1.fluentd.fluentd_plugin:
    name: "{{ item.name }}"
    version: "{{ item.version | default(omit) }}"
    state: present
  loop: "{{ fluentd_plugins }}"
  when: fluentd_plugins | length > 0

- name: Deploy Fluentd configuration
  ansible.builtin.template:
    src: "{{ fluentd_config_template }}"
    dest: "{{ fluentd_config_path }}"
    owner: "{{ fluentd_user }}"
    group: "{{ fluentd_group }}"
    mode: "0640"
    validate: "{{ fluentd_bin | default('/usr/sbin/fluentd') }} --dry-run -c %s"
  notify: Restart fluentd

- name: Ensure Fluentd service is in desired state
  ansible.builtin.service:
    name: "{{ fluentd_service_name }}"
    enabled: "{{ fluentd_service_enabled }}"
    state: "{{ fluentd_service_state }}"
