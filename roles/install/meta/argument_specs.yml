---
argument_specs:
  main:
    short_description: Install and configure Fluentd
    options:
      install_package_name:
        type: str
        default: fluent-package
        description: Package to install (fluent-package or td-agent).
      install_version:
        type: str
        default: ""
        description: Pin to a specific package version.
      install_manage_repo:
        type: bool
        default: true
        description: Configure the official Treasure Data repository.
      install_service_name:
        type: str
        default: fluentd
        description: Name of the systemd service.
      install_service_enabled:
        type: bool
        default: true
        description: Enable the service at boot.
      install_service_state:
        type: str
        default: started
        description: Desired service state.
      install_config_path:
        type: str
        default: /etc/fluent/fluentd.conf
        description: Path to the main configuration file.
      install_plugins:
        type: list
        elements: dict
        default: []
        description: List of plugins to install via fluent-gem.
      install_log_level:
        type: str
        default: info
        description: Fluentd log level.
      install_workers:
        type: int
        default: 1
        description: Number of fluentd worker processes.
