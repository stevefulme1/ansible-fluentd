---
- name: Install fluent-package (check mode)
  stevefulme1.fluentd.fluentd_install:
    state: present
  check_mode: true
  register: check_result

- name: Assert check mode reports changed
  ansible.builtin.assert:
    that:
      - check_result is changed

- name: Install fluent-package
  stevefulme1.fluentd.fluentd_install:
    state: present
  register: install_result

- name: Assert install changed
  ansible.builtin.assert:
    that:
      - install_result is changed
      - install_result.package == "fluent-package"

- name: Install fluent-package again (idempotency)
  stevefulme1.fluentd.fluentd_install:
    state: present
  register: idem_result

- name: Assert idempotent
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Remove fluent-package (check mode)
  stevefulme1.fluentd.fluentd_install:
    state: absent
  check_mode: true
  register: remove_check

- name: Assert remove check mode reports changed
  ansible.builtin.assert:
    that:
      - remove_check is changed

- name: Remove fluent-package
  stevefulme1.fluentd.fluentd_install:
    state: absent
  register: remove_result

- name: Assert remove changed
  ansible.builtin.assert:
    that:
      - remove_result is changed

- name: Remove fluent-package again (idempotency)
  stevefulme1.fluentd.fluentd_install:
    state: absent
  register: remove_idem

- name: Assert remove idempotent
  ansible.builtin.assert:
    that:
      - remove_idem is not changed
